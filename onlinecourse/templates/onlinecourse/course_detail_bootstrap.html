<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ course.name }}</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="display-4">{{ course.name }}</h1>
    
    <div class="mt-4">
        <h3>Lessons</h3>
        <ul class="list-group">
            {% for lesson in course.lesson_set.all %}
            <li class="list-group-item">
                <h5>{{ lesson.title }}</h5>
                <p>{{ lesson.content }}</p>
            </li>
            {% endfor %}
        </ul>
    </div>

    <div class="mt-4">
        <a class="btn btn-primary" href="{% url 'onlinecourse:registration' %}">Sign Up to Take Exam</a>
    </div>
</div>
</body>
</html>
